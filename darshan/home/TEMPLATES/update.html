
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
     
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">Add New Product</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                
                <div class="modal-body p-4">
                    <!-- C.I (Choose Image) -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Choose Image</label>
                        <input type="file" name="image" class="form-control" accept="image/*" required>
                    </div>

                    <!-- Products Name -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Products Name</label>
                        <input type="text" name="name" class="form-control" placeholder="Enter Product Name" required>
                    </div>

                    <!-- Products Description -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Products Description</label>
                        <textarea name="description" class="form-control" rows="2" placeholder="Enter Description" required></textarea>
                    </div>

                    <!-- Products Price -->
                    <div class="mb-3">
                        <label class="form-label fw-bold">Products Price</label>
                        <input type="number" name="price" class="form-control" placeholder="Enter Price (₹)" required>
                    </div>
                </div>

                <div class="modal-footer justify-content-center">
                    <!-- SUB (Submit) -->
                    <button type="submit" class="btn btn-outline-success px-5 fw-bold">Submit</button>
                </div>
            </form>
</body>
</html>
